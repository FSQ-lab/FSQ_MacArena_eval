[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fsq-macarena-eval"
version = "0.1.0"
description = "Official MacArena benchmark harness for native FSQ macOS capability evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.16.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
host = [
    "beautifulsoup4>=4.12.0",
    "borb>=2.1.20,<3.0.0",
    "chardet>=5.2.0",
    "cssselect>=1.2.0",
    "easyocr>=1.7.1",
    "fastdtw>=0.3.4",
    "formulas>=1.2.8",
    "gymnasium>=0.28.1",
    "imagehash>=4.3.1",
    "librosa>=0.10.2",
    "lxml==6.1.0",
    "matplotlib>=3.8.0",
    "mutagen>=1.47.0",
    "numpy>=1.26.0,<2.3.0",
    "odfpy>=1.4.1",
    "opencv-python-headless>=4.10.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pdfplumber>=0.11.4",
    "pillow>=11.0.0",
    "playwright>=1.49.0",
    "pyacoustid>=1.3.0",
    "pydrive>=1.3.1",
    "pymupdf>=1.24.10",
    "pypdf>=5.1.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-pptx>=1.0.2",
    "pytz>=2024.2",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10.0",
    "requests-toolbelt>=1.0.0",
    "scikit-image>=0.24.0",
    "scipy>=1.14.0",
    "tldextract>=5.1.2",
    "tqdm>=4.66.0",
    "xmltodict>=0.14.2",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
fsq-macarena-eval = "fsq_macarena_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fsq_macarena_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
